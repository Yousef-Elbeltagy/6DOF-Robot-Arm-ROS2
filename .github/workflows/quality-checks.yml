name: Repository quality checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast

          files = sorted(Path('src/robot_arm_python/robot_arm_python').rglob('*.py'))
          if not files:
              raise SystemExit('No Python source files found')
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              print(f'OK: {path}')
          PY

      - name: Shell syntax check
        run: |
          find scripts -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Validate package.xml files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path('src').rglob('package.xml'))
          if not files:
              raise SystemExit('No package.xml files found')
          for path in files:
              ET.parse(path)
              print(f'OK: {path}')
          PY

      - name: Check required project files
        run: |
          test -f README.md
          test -f QUICKSTART.md
          test -f CHANGELOG.md
          test -f ROADMAP.md
          test -f LICENSE
          test -f NOTICE
          test -f CONTRIBUTING.md
          test -f docs/README.md
          test -f docs/REPRODUCE_PROJECT.md
          test -f docs/CONTINUE_DEVELOPMENT.md
          test -f docs/TROUBLESHOOTING.md
          test -f docs/BOM.md
          test -f cad/README.md
          test -f scripts/check_system.sh
          test -f scripts/setup_dependencies.sh
          test -f scripts/build_workspace.sh
          test -f scripts/start_robot.sh

      - name: Check published CAD packages
        run: |
          test -f cad/Solidworks_Cad_models/full_Cobot_Solidworks_Cad.zip
          test -f cad/Solidworks_Cad_models/Cobot_Jigs_Solidworks_Cad.zip
          test -f cad/Solidworks_Cad_models/Pick_Table_Solidworks_Cad.zip
          test -f cad/STEP_Exports/Complete_Robot_Workcell_STEP_Components.zip

      - name: Check for common generated artifacts
        run: |
          ! find . -path './.git' -prune -o \( -name '__pycache__' -o -name '*.pyc' -o -name 'build' -o -name 'install' -o -name 'log' \) -print | grep -q .
